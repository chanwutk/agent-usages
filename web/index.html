<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent usage</title>
<style>
  header, #banner, main { width: min(1080px, calc(100% - 32px)); margin: 16px auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { margin: 0; }
  #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .card { border: 1px solid gray; padding: 12px; display: flex; flex-direction: column; }
  .foot { margin-top: auto; }
  .window { margin: 0 0 12px; }
  .window-head { display: flex; justify-content: space-between; gap: 8px; }
  .track { position: relative; height: 10px; margin: 10px 0; background: lightgray; }
  .fill { height: 100%; background: green; }
  .fill.high { background: darkorange; }
  .pace {
    position: absolute;
    top: -6px;
    bottom: -6px;
    width: 2px;
    margin-left: -2px;
    background: black;
    border: 1px solid white;
  }
  .foot.bad, #banner { color: red; }
</style>
</head>
<body>
<header>
  <h1>Agent usage</h1>
  <button id="refresh" type="button">Refresh</button>
</header>
<p id="banner" hidden></p>
<main id="cards"></main>
<template id="card">
  <section class="card">
    <h2 data-name></h2>
    <div data-windows></div>
    <p class="foot" data-updated></p>

  </section>
</template>
<template id="window">
  <div class="window">
  <div class="window-head">
    <span data-label></span>
    <span data-percent></span>
  </div>
  <div class="track" data-bar role="progressbar" aria-valuemin="0" aria-valuemax="100">
  <div class="fill" data-fill></div>
  <div class="pace" data-pace hidden title="Time elapsed in this window"></div>
</div>

  <p class="reset" data-reset></p>
</div>

</template>
<script>
const NAMES = { claude: "Claude", codex: "Codex", cursor: "Cursor" };
const WINDOW_MS = { session: 5 * 60 * 60 * 1000, week: 7 * 24 * 60 * 60 * 1000 };
const KINDS = { session: "5-hour session", week: "This week", period: "Billing period" };

function timeElapsed(win) {
  const end = Date.parse(win.resets_at);
  if (Number.isNaN(end)) return null;
  let start = Date.parse(win.starts_at);
  if (Number.isNaN(start)) {
    const dur = WINDOW_MS[win.kind];
    if (!dur) return null;
    start = end - dur;
  }
  const span = end - start;
  if (span <= 0) return null;
  return Math.max(0, Math.min(100, ((Date.now() - start) / span) * 100));
}

function resetsIn(iso) {
  const ms = Date.parse(iso) - Date.now();
  if (!iso || Number.isNaN(ms)) return "N/A";
  if (ms <= 0) return "resets in 0m";
  const mins = Math.round(ms / 60000);
  const days = Math.floor(mins / 1440);
  const hours = Math.floor((mins % 1440) / 60);
  const minutes = mins % 60;
  if (days > 0) return "resets in " + days + "d " + hours + "h";
  if (hours > 0) return "resets in " + hours + "h " + minutes + "m";
  return "resets in " + minutes + "m";
}

function fillWindow(node, win) {
  const label = (win.scope ? win.scope + " · " : "") + (KINDS[win.kind] || win.kind);
  const used = Math.max(0, Math.min(100, win.used_percent));
  node.querySelector("[data-label]").textContent = label;
  node.querySelector("[data-percent]").textContent = win.used_percent + "%";
  const bar = node.querySelector("[data-bar]");
  bar.setAttribute("aria-valuenow", String(Math.round(used)));
  bar.setAttribute("aria-label", label);
  const fill = node.querySelector("[data-fill]");
  fill.style.width = used + "%";
  fill.classList.toggle("high", used >= 80);
  const pace = node.querySelector("[data-pace]");
  const elapsed = timeElapsed(win);
  if (elapsed === null) pace.hidden = true;
  else {
    pace.hidden = false;
    pace.style.left = elapsed + "%";
  }
  node.querySelector("[data-reset]").textContent = resetsIn(win.resets_at);
}

function footer(provider) {
  const when = provider.fetched_at
    ? provider.fetched_at.replace("T", " ").replace("Z", " UTC")
    : "";
  if (provider.ok === false) {
    return when && provider.windows.length
      ? provider.message + " · last sample " + when
      : (provider.message || "fetch failed");
  }
  if (!provider.fetched_at) return provider.message || "";
  return "Updated " + when;
}

function render(data) {
  const root = document.getElementById("cards");
  const cardTpl = document.getElementById("card");
  const winTpl = document.getElementById("window");
  root.replaceChildren();
  data.providers.forEach(function (provider) {
    const card = cardTpl.content.firstElementChild.cloneNode(true);
    card.querySelector("[data-name]").textContent = NAMES[provider.id] || provider.id;
    const windows = card.querySelector("[data-windows]");
    if (!provider.windows.length && provider.ok !== false) {
      const empty = document.createElement("p");
      empty.textContent = "No samples yet";
      windows.appendChild(empty);
    }
    provider.windows.forEach(function (win) {
      const node = winTpl.content.firstElementChild.cloneNode(true);
      fillWindow(node, win);
      windows.appendChild(node);
    });
    const foot = card.querySelector("[data-updated]");
    foot.classList.toggle("bad", provider.ok === false);
    foot.textContent = footer(provider);
    root.appendChild(card);
  });
}

async function load(refresh) {
  const button = document.getElementById("refresh");
  const banner = document.getElementById("banner");
  button.disabled = true;
  try {
    const res = await fetch(refresh ? "/api/refresh" : "/api/usage", {
      method: refresh ? "POST" : "GET"
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    banner.hidden = true;
    render(await res.json());
  } catch (err) {
    banner.hidden = false;
    banner.textContent = "Could not load usage. " + err.message;
  } finally {
    button.disabled = false;
  }
}

document.getElementById("refresh").addEventListener("click", function () { load(true); });
load(false);
setInterval(function () { load(false); }, 15000);
</script>


</body>
</html>
